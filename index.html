<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <!-- <link rel="stylesheet" href="style.css" /> -->

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');

        :root {
            --accent-color: #8672FF;
            --base-color: white;
            --text-color: #2E2B41;
            --input-color: #F3F0FF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-family: Poppins, 'Segoe UI', sans-serif;
            font-size: 12pt;
            color: var(--text-color);
            text-align: center;
        }

        body {
            min-height: 100vh;
            display: grid;
            align-items: center;
            justify-content: center;
        }

        .container {
            background-color: var(--base-color);
            /* padding: 40px 30px; */
            box-shadow: 0 0 10px 5px rgba(0, 0, 0, 0.2);
            border-radius: 10px;
        }

        .container .content {
            display: flex;
            align-items: center;
            position: relative;
        }

        .content .image-box {
            display: flex;
            max-width: 50%;
        }

        /* .content .image-box img {
            width: 55rem;
        } */

        .content .form-container {
            width: 50%;
            position: absolute;
            right: 2px;
        }

        .title,
        h2 {
            font-size: 3rem;
            font-weight: 900;
            text-transform: uppercase;
        }

        .login-form {
            margin-block: 20px 50px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 20px;
        }

        .login-form>div {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .login-form label {
            flex-shrink: 0;
            height: 50px;
            width: 50px;
            background-color: var(--accent-color);
            fill: var(--base-color);
            border-radius: 10px 0 0 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-form input {
            flex-grow: 1;
            min-width: 0;
            height: 50px;
            padding: 1em;
            font: inherit;
            border-radius: 0 10px 10px 0;
            border: 2px solid var(--input-color);
            border-left: none;
            background-color: var(--input-color);
        }

        .login-form input:hover {
            border-color: var(--accent-color);
        }

        .login-form input:focus {
            outline: none;
            border-color: var(--text-color);
        }

        div:has(input:focus)>label {
            background-color: var(--text-color);
        }

        .login-form input::placeholder {
            color: var(--text-color);
            opacity: .5;
        }

        .login-form>div span {
            position: relative;
            width: 100%;
            display: flex;
        }

        .login-form>div span>svg {
            width: 20px;
            height: 20px;
            position: absolute;
            top: 50%;
            margin-top: -.62rem;
            right: 1rem;
            fill: var(--text-color);
            cursor: pointer;
            opacity: .5;
        }

        .login-form button {
            margin-top: 10px;
            border: none;
            border-radius: 10px;
            padding: .85em 4em;
            background-color: var(--accent-color);
            color: var(--base-color);
            font: inherit;
            font-weight: 600;
            text-transform: uppercase;
            cursor: pointer;
            transition: 150ms all ease;
        }

        .login-form button:hover {
            background-color: var(--text-color);
        }

        .login-form button:focus {
            outline: none;
            border-color: var(--text-color);
        }

        @media(max-width: 1100px) {
            .content .image-box {
                display: none;
            }

            .content .form-container {
                position: static;
                width: 100%;
            }
        }

        .login-form div.incorrect label {
            background-color: #f06272;
        }

        .login-form div.incorrect input {
            border-color: #f06272;
        }

        #error-message {
            color: #f06272;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="content">
            <div class="image-box">
                <img src="https://transfers.tnschools.gov.in/assets/images/others/loginDesign2.png" alt="">
            </div>
            <div class="form-container">
                <div class="login-form">
                    <div class="title">Login</div>
                    <div id="username">
                        <label for="usernameField">
                            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px">
                                <path
                                    d="M480-480q-66 0-113-47t-47-113q0-66 47-113t113-47q66 0 113 47t47 113q0 66-47 113t-113 47ZM160-160v-112q0-34 17.5-62.5T224-378q62-31 126-46.5T480-440q66 0 130 15.5T736-378q29 15 46.5 43.5T800-272v112H160Z" />
                            </svg>
                        </label>
                        <input type="text" id="usernameField" placeholder="Username">
                    </div>
                    <div id="password">
                        <label for="passwordField">
                            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px">
                                <path
                                    d="M240-80q-33 0-56.5-23.5T160-160v-400q0-33 23.5-56.5T240-640h40v-80q0-83 58.5-141.5T480-920q83 0 141.5 58.5T680-720v80h40q33 0 56.5 23.5T800-560v400q0 33-23.5 56.5T720-80H240Zm240-200q33 0 56.5-23.5T560-360q0-33-23.5-56.5T480-440q-33 0-56.5 23.5T400-360q0 33 23.5 56.5T480-280ZM360-640h240v-80q0-50-35-85t-85-35q-50 0-85 35t-35 85v80Z" />
                            </svg>
                        </label>
                        <span>
                            <input type="password" id="passwordField" placeholder="Password">
                            <svg id="pass-visibility" xmlns="http://www.w3.org/2000/svg" height="24px"
                                viewBox="0 -960 960 960" width="24px">
                                <path
                                    d="M480-320q75 0 127.5-52.5T660-500q0-75-52.5-127.5T480-680q-75 0-127.5 52.5T300-500q0 75 52.5 127.5T480-320Zm0-72q-45 0-76.5-31.5T372-500q0-45 31.5-76.5T480-608q45 0 76.5 31.5T588-500q0 45-31.5 76.5T480-392Zm0 192q-146 0-266-81.5T40-500q54-137 174-218.5T480-800q146 0 266 81.5T920-500q-54 137-174 218.5T480-200Zm0-300Zm0 220q113 0 207.5-59.5T832-500q-50-101-144.5-160.5T480-720q-113 0-207.5 59.5T128-500q50 101 144.5 160.5T480-280Z" />
                            </svg>
                        </span>
                    </div>
                    <p id="error-message"></p>
                    <button id="login-btn">Login</button>
                </div>
            </div>
        </div>
    </div>
</body>
<script>
    const el = {
        username: {
            parent: document.getElementById("username"),
            label: document.querySelector("#username > label"),
            input: document.getElementById("usernameField")
        },

        password: {
            parent: document.getElementById("password"),
            label: document.querySelector("#password > label"),
            input: document.getElementById("passwordField"),
            visibility: document.getElementById("pass-visibility")
        },

        errorMsg: document.getElementById("error-message"),

        submitBtn: document.getElementById("login-btn")
    }

    let pass_visible = false;
    el.password.visibility.addEventListener("click", () => {
        if (pass_visible) {
            pass_visible = false;
            el.password.visibility.innerHTML = `<path d="M480-320q75 0 127.5-52.5T660-500q0-75-52.5-127.5T480-680q-75 0-127.5 52.5T300-500q0 75 52.5 127.5T480-320Zm0-72q-45 0-76.5-31.5T372-500q0-45 31.5-76.5T480-608q45 0 76.5 31.5T588-500q0 45-31.5 76.5T480-392Zm0 192q-146 0-266-81.5T40-500q54-137 174-218.5T480-800q146 0 266 81.5T920-500q-54 137-174 218.5T480-200Zm0-300Zm0 220q113 0 207.5-59.5T832-500q-50-101-144.5-160.5T480-720q-113 0-207.5 59.5T128-500q50 101 144.5 160.5T480-280Z"/>`;
            el.password.input.type = "password";
        } else {
            pass_visible = true;
            el.password.visibility.innerHTML = `<path d="m644-428-58-58q9-47-27-88t-93-32l-58-58q17-8 34.5-12t37.5-4q75 0 127.5 52.5T660-500q0 20-4 37.5T644-428Zm128 126-58-56q38-29 67.5-63.5T832-500q-50-101-143.5-160.5T480-720q-29 0-57 4t-55 12l-62-62q41-17 84-25.5t90-8.5q151 0 269 83.5T920-500q-23 59-60.5 109.5T772-302Zm20 246L624-222q-35 11-70.5 16.5T480-200q-151 0-269-83.5T40-500q21-53 53-98.5t73-81.5L56-792l56-56 736 736-56 56ZM222-624q-29 26-53 57t-41 67q50 101 143.5 160.5T480-280q20 0 39-2.5t39-5.5l-36-38q-11 3-21 4.5t-21 1.5q-75 0-127.5-52.5T300-500q0-11 1.5-21t4.5-21l-84-82Zm319 93Zm-151 75Z"/>`;
            el.password.input.type = "text";
        }
    })

    el.submitBtn.addEventListener("click", (e) => {
        e.preventDefault();

        let errorMsg = "";
        if (!el.username.input.value) {
            el.username.parent.classList.add("incorrect");
            errorMsg = "Field should not be empty!";
        }
        if (!el.password.input.value) {
            el.password.parent.classList.add("incorrect");
            errorMsg = "Field should not be empty!";
        }

        el.username.input.addEventListener("input", function () {
            if (el.username.parent.classList.contains("incorrect")) {
                el.username.parent.classList.remove("incorrect");
            }
        })

        el.password.input.addEventListener("input", function () {
            if (el.password.parent.classList.contains("incorrect")) {
                el.password.parent.classList.remove("incorrect");
            }
        })

        if (el.username.input.value === "admin" && el.password.input.value === "123") {
            errorMsg = false;
            sessionStorage.setItem("isLoggedIn", "true");
            window.location.href = "./timetable.html";
        } else if (el.username.input.value && el.password.input.value) {
            errorMsg = "Invalid username or password!!";
        }

        if (errorMsg) {
            el.errorMsg.textContent = errorMsg;
            const timeOut = setInterval(() => {
                el.errorMsg.textContent = "";
                clearInterval(timeOut);
            }, 2000)
        }
    })
</script>

</html>
